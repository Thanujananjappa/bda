services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=dropout-cluster
    env_file:
      - ./config/hadoop.env
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    ports:
      - "9870:9870"
      - "9000:9000"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    depends_on:
      - namenode
    env_file:
      - ./config/hadoop.env
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    ports:
      - "9864:9864"

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka..."
        cub kafka-ready -b kafka:9092 1 60
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic student-events --partitions 3 --replication-factor 1
        echo "Topic student-events ready."

  hdfs-init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    depends_on:
      - namenode
    env_file:
      - ./config/hadoop.env
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        sleep 15
        hdfs dfs -mkdir -p /student-data/raw /student-data/processed /student-data/scores || true
        echo "HDFS paths initialized."

  # Optional: run weekly scoring on an interval (host must mount project + trained model)
  scoring-worker:
    profiles: ["worker"]
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      SCORING_INTERVAL_MINUTES: "1440"
      WEEKLY_SCHEDULER_ENABLED: "true"
      KAFKA_BOOTSTRAP: kafka:9092
      HDFS_NAMENODE_HOST: namenode
    depends_on:
      - kafka
      - namenode
    command: >
      bash -c "pip install -q -r requirements.txt &&
      python ml/weekly_scoring.py &&
      python -c \"from jobs.scheduler import start_scheduler; import time; start_scheduler(); time.sleep(10**9)\""

volumes:
  hadoop_namenode:
  hadoop_datanode:
